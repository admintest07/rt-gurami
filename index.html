<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart RT Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tambahan library untuk cetak PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, #1e1b4b, #312e81, #1e3a8a, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            min-height: 100vh;
            color: #ffffff;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Classes */
        .glass-dark {
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            transition: all 0.2s ease;
        }
        
        .glass-card:active { transform: scale(0.98); }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
        }

        /* Mobile Banking specific styles */
        .bottom-nav-safe { padding-bottom: 90px; }
        
        .m-bank-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
            border-top: 1px solid rgba(255,255,255,0.3);
            border-left: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .m-bank-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0.5;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        .hidden-view { display: none !important; }
        .text-shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="antialiased">

    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-dark p-6 sm:p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/20 blur-3xl rounded-full"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-pink-500/20 blur-3xl rounded-full"></div>
            
            <div class="mb-8 relative z-10">
                <div class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30 border border-white/20 transform rotate-12">
                    <i class="fa-solid fa-building-user text-3xl text-white -rotate-12"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Smart RT Mobile</h1>
                <p class="text-white/60 mt-1 text-sm font-medium">Digitalisasi Lingkungan RT Anda</p>
            </div>
            
            <div class="space-y-3 relative z-10">
                <button onclick="login('warga')" class="w-full bg-white/10 hover:bg-white/20 border border-white/10 py-3.5 rounded-xl font-semibold flex items-center justify-between px-5 transition-colors">
                    <div class="flex items-center gap-3 text-sm"><i class="fa-solid fa-user text-blue-300"></i> Warga</div>
                    <i class="fa-solid fa-chevron-right text-white/40 text-xs"></i>
                </button>
                <button onclick="login('petugas')" class="w-full bg-white/10 hover:bg-white/20 border border-white/10 py-3.5 rounded-xl font-semibold flex items-center justify-between px-5 transition-colors">
                    <div class="flex items-center gap-3 text-sm"><i class="fa-solid fa-clipboard-list text-green-300"></i> Petugas Iuran</div>
                    <i class="fa-solid fa-chevron-right text-white/40 text-xs"></i>
                </button>
                <button onclick="login('admin')" class="w-full bg-white/10 hover:bg-white/20 border border-white/10 py-3.5 rounded-xl font-semibold flex items-center justify-between px-5 transition-colors">
                    <div class="flex items-center gap-3 text-sm"><i class="fa-solid fa-crown text-yellow-300"></i> Ketua RT (Admin)</div>
                    <i class="fa-solid fa-chevron-right text-white/40 text-xs"></i>
                </button>
            </div>
            <div id="sync-status" class="mt-8 text-xs text-white/60 flex items-center justify-center gap-1.5 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse" id="sync-dot"></span>
                <span id="sync-text">Menghubungkan ke Cloud...</span>
            </div>
        </div>
    </div>

    <div id="app-view" class="hidden-view min-h-screen flex flex-col items-center">
        <!-- Kontainer pembatas lebar -->
        <div class="w-full max-w-md w-full min-h-screen flex flex-col relative bg-black/20 shadow-2xl">
            
            <!-- Dynamic Top Header -->
            <header id="top-header" class="glass-dark sticky top-0 z-30 px-5 py-4 flex justify-between items-center border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center border border-white/30 shadow-md">
                        <i id="header-avatar-icon" class="fa-solid fa-user text-white text-lg drop-shadow-md"></i>
                    </div>
                    <div>
                        <p class="text-[10px] text-white/70 font-semibold uppercase tracking-wider" id="header-role">Role</p>
                        <h2 class="text-sm font-bold text-white leading-tight" id="header-name">Nama User</h2>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Tombol Aktifkan Notifikasi PWA -->
                    <button onclick="requestNotificationPermissionUI()" class="relative w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center border border-white/10 transition-colors" title="Aktifkan Notifikasi PWA">
                        <i id="bell-icon" class="fa-regular fa-bell text-white/80 text-sm transition-all duration-300"></i>
                        <span id="bell-badge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-green-500 rounded-full border border-[#1e1b4b] hidden"></span>
                    </button>
                    <!-- Tombol Logout Global -->
                    <button onclick="logout()" class="relative w-8 h-8 rounded-full bg-red-500/10 hover:bg-red-500/20 flex items-center justify-center border border-red-500/30 transition-colors" title="Keluar / Ganti Akun">
                        <i class="fa-solid fa-power-off text-red-400 text-sm"></i>
                    </button>
                </div>
            </header>

            <!-- Main Scrollable Content -->
            <main class="flex-1 w-full overflow-y-auto bottom-nav-safe pb-24 custom-scrollbar relative">
                <div id="content-container" class="p-4 sm:p-5 space-y-5">
                    <!-- Konten disuntikkan via JS -->
                </div>
            </main>

            <!-- Fixed Bottom Navigation (Standard M-Banking) -->
            <nav class="glass-dark fixed bottom-0 w-full max-w-md z-40 px-2 py-2 pb-safe border-t border-white/10 rounded-t-2xl flex justify-between items-center" id="bottom-nav">
                <!-- Nav items disuntikkan via JS -->
            </nav>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = {
            apiKey: "AIzaSyD24_oHwL07c90a_Z2kzt0YtDAX4SJ0GvM",
            authDomain: "smart-rt-d95b8.firebaseapp.com",
            projectId: "smart-rt-d95b8",
            storageBucket: "smart-rt-d95b8.firebasestorage.app",
            messagingSenderId: "813566749140",
            appId: "1:813566749140:web:0255ec42f83e72a880ce41"
        };

        let app, db, auth;
        const currentMonthId = "2026-08"; 

        window.state = {
            nominalIuran: 50000,
            pengumuman: {
                judul: "Kerja Bakti Pembersihan Selokan",
                deskripsi: "Dihimbau kepada seluruh bapak-bapak warga Blok A dan B untuk hadir pada hari Minggu pagi membawa alat kebersihan masing-masing. Mari cegah banjir bersama!",
                tanggal: "Minggu, 11 Okt 2026, 07:00 WIB",
                dateInput: "2026-10-11",
                timeInput: "07:00"
            },
            appSettings: {
                adminName: 'Hendra (RT)',
                adminPin: '123456',
                petugasName: 'Pak Yanto',
                petugasPin: '123456'
            },
            currentUser: null,
            currentView: 'dashboard',
            wargaList: [],
            iuranList: [],
            laporanList: [],
            suratList: [],
            pengeluaranList: [],
            users: {
                warga: { role: 'warga', name: 'Budi Santoso', wargaId: 101, icon: 'fa-user' },
                petugas: { role: 'petugas', name: 'Pak Yanto', icon: 'fa-clipboard-user' },
                admin: { role: 'admin', name: 'Hendra (RT)', icon: 'fa-crown' }
            }
        };

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);

                document.getElementById('sync-dot').className = "w-1.5 h-1.5 rounded-full bg-green-400";
                document.getElementById('sync-text').innerText = "Terhubung";

                setupRealtimeSync();
            } catch (err) {
                console.error("Firebase init error:", err);
                document.getElementById('sync-dot').className = "w-1.5 h-1.5 rounded-full bg-red-400";
                
                if (err.code === 'auth/operation-not-allowed') {
                    document.getElementById('sync-text').innerText = "Error: Aktifkan Login Anonim!";
                } else if (err.code === 'permission-denied' || (err.message && err.message.includes('permissions'))) {
                     document.getElementById('sync-text').innerText = "Akses Ditolak (Cek Rules)";
                } else if (err.code) {
                    document.getElementById('sync-text').innerText = "Error: " + err.code;
                } else {
                    document.getElementById('sync-text').innerText = "Offline Mode / Cek Rules";
                }
                
                loadDefaultMockData();
            }
        }

        function loadDefaultMockData() {
            window.state.wargaList = [
                { id: 101, nama: "Budi Santoso", blok: "A-01", telp: "08123456789", status: "Aktif", pin: "123456" },
                { id: 102, nama: "Siti Aminah", blok: "A-02", telp: "08198765432", status: "Aktif", pin: "123456" },
                { id: 103, nama: "Agus Pratama", blok: "B-01", telp: "08567891234", status: "Aktif", pin: "123456" }
            ];
            window.state.iuranList = [
                { id: 1, wargaId: 101, bulan: "2026-07", jumlah: 50000, status: "Lunas", tanggal: "2026-07-05" },
                { id: 2, wargaId: 101, bulan: "2026-08", jumlah: 50000, status: "Lunas", tanggal: "2026-08-02" }
            ];
        }

        async function setupRealtimeSync() {
            const dataRef = doc(db, 'artifacts', appId); 
            
            try {
                const docSnap = await getDoc(dataRef);
                if (!docSnap.exists()) {
                    loadDefaultMockData();
                    await setDoc(dataRef, {
                        nominalIuran: window.state.nominalIuran,
                        pengumuman: window.state.pengumuman,
                        appSettings: window.state.appSettings,
                        wargaList: window.state.wargaList,
                        iuranList: window.state.iuranList,
                        laporanList: window.state.laporanList,
                        suratList: window.state.suratList,
                        pengeluaranList: window.state.pengeluaranList
                    });
                }
            } catch (e) {
                console.warn("Client offline:", e);
                loadDefaultMockData();
                document.getElementById('sync-dot').className = "w-1.5 h-1.5 rounded-full bg-red-400";
                if (e.code === 'permission-denied' || (e.message && e.message.includes('permissions'))) {
                     document.getElementById('sync-text').innerText = "Akses Ditolak (Cek Rules)";
                } else {
                     document.getElementById('sync-text').innerText = "Koneksi Terputus";
                }
                if (window.state.currentUser) renderContent();
            }

            try {
                onSnapshot(dataRef, (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        const prevIuranCount = window.state.iuranList.length;
                        const prevPengumumanTanggal = window.state.pengumuman ? window.state.pengumuman.tanggal : null;
                        
                        window.state.nominalIuran = data.nominalIuran || 50000;
                        window.state.appSettings = data.appSettings || {
                            adminName: 'Hendra (RT)', adminPin: '123456',
                            petugasName: 'Pak Yanto', petugasPin: '123456'
                        };
                        window.state.wargaList = data.wargaList || [];
                        window.state.iuranList = data.iuranList || [];
                        window.state.laporanList = data.laporanList || [];
                        window.state.suratList = data.suratList || [];
                        window.state.pengeluaranList = data.pengeluaranList || [];
                        window.state.pengumuman = data.pengumuman || {
                            judul: "Kerja Bakti Pembersihan Selokan",
                            deskripsi: "Dihimbau kepada seluruh bapak-bapak warga Blok A dan B untuk hadir pada hari Minggu pagi membawa alat kebersihan masing-masing. Mari cegah banjir bersama!",
                            tanggal: "Minggu, 11 Okt 2026, 07:00 WIB",
                            dateInput: "2026-10-11",
                            timeInput: "07:00"
                        };

                        window.state.users.admin.name = window.state.appSettings.adminName;
                        window.state.users.petugas.name = window.state.appSettings.petugasName;

                        if (window.state.currentUser) {
                            window.state.currentUser.name = window.state.users[window.state.currentUser.role].name;
                            const headerName = document.getElementById('header-name');
                            if (headerName) headerName.innerText = window.state.currentUser.name;
                        }

                        if (prevIuranCount > 0 && window.state.iuranList.length > prevIuranCount && window.state.currentUser) {
                            const latest = window.state.iuranList[window.state.iuranList.length - 1];
                            const wargaObj = window.state.wargaList.find(w => w.id === latest.wargaId);
                            showCustomToast(`💰 Iuran Masuk: ${wargaObj ? wargaObj.nama : 'Warga'} (Bln ${latest.bulan})`);
                            
                            // Trigger Notifikasi OS (Push)
                            if (typeof triggerNativeNotification === 'function') {
                                triggerNativeNotification('Dana Masuk RT 💰', `${wargaObj ? wargaObj.nama : 'Warga'} baru saja membayar iuran untuk bulan ${formatBln(latest.bulan)}.`);
                            }
                        }

                        // Trigger notifikasi OS jika ada pengumuman baru
                        if (prevPengumumanTanggal && window.state.pengumuman && prevPengumumanTanggal !== window.state.pengumuman.tanggal && window.state.currentUser) {
                            if (typeof triggerNativeNotification === 'function') {
                                triggerNativeNotification('📢 Pengumuman RT Baru', window.state.pengumuman.judul);
                            }
                        }

                        // Cegah re-render saat di form agar input pengguna tidak hilang & tidak berkedip
                        const formViews = ['kelola_warga', 'kelola_pengeluaran', 'kelola_pengumuman', 'pengaturan', 'ganti_pin_warga', 'laporan_warga', 'surat_warga'];
                        if (window.state.currentUser && !formViews.includes(window.state.currentView)) {
                            renderContent();
                        }
                    }
                });
            } catch (e) {
                console.error("Gagal memulai sinkronisasi real-time:", e);
            }
        }

        window.saveToCloud = async function() {
            try {
                const dataRef = doc(db, 'artifacts', appId);
                await setDoc(dataRef, {
                    nominalIuran: window.state.nominalIuran,
                    pengumuman: window.state.pengumuman,
                    appSettings: window.state.appSettings,
                    wargaList: window.state.wargaList,
                    iuranList: window.state.iuranList,
                    laporanList: window.state.laporanList,
                    suratList: window.state.suratList,
                    pengeluaranList: window.state.pengeluaranList
                });
            } catch (err) {
                console.error("Error saving:", err);
                if (err.code === 'permission-denied' || (err.message && err.message.includes('permissions'))) {
                    showCustomToast('⚠️ Gagal: Akses Firebase Ditolak (Rules)');
                } else {
                    showCustomToast('⚠️ Sedang offline: Tersimpan lokal');
                }
            }
        };

        window.onload = () => {
            if (typeof window.restoreSession === 'function') {
                window.restoreSession();
            }
            initFirebase();
            if (typeof window.initPWA === 'function') {
                window.initPWA();
            } else if (typeof initPWA === 'function') {
                initPWA();
            }
        };
    </script>

    <script>
        window.restoreSession = function() {
            const savedUser = localStorage.getItem('smartrt_user');
            const savedView = localStorage.getItem('smartrt_view');
            
            if (savedUser) {
                state.currentUser = JSON.parse(savedUser);
                state.currentView = savedView || 'dashboard';

                document.getElementById('login-view').classList.add('hidden-view');
                document.getElementById('app-view').classList.remove('hidden-view');

                document.getElementById('header-name').innerText = state.currentUser.name;
                document.getElementById('header-role').innerText = state.currentUser.role;
                const headerIcon = document.getElementById('header-avatar-icon');
                if (headerIcon) {
                    headerIcon.className = `fa-solid ${state.currentUser.icon} text-white text-lg drop-shadow-md`;
                }

                updateBottomNav();
                renderContent();
            }
        };

        function login(roleKey) {
            if (roleKey === 'admin' || roleKey === 'petugas') {
                showPinModal(roleKey);
            } else if (roleKey === 'warga') {
                showPilihWargaLoginModal();
            }
        }

        function showPilihWargaLoginModal() {
            let ex = document.getElementById('warga-login-modal');
            if(ex) ex.remove();

            const t = document.createElement('div');
            t.id = 'warga-login-modal';
            t.className = 'fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-md sm:p-4 animate-[fadeIn_0.2s_ease-out]';
            t.innerHTML = `
                <div class="glass-card bg-[#16203a] p-5 sm:rounded-3xl rounded-t-3xl rounded-b-none w-full max-w-sm text-center border border-white/20 shadow-2xl relative max-h-[85vh] flex flex-col pb-8">
                    <button id="btn-close-warga-login" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/50 hover:text-white transition-colors z-10"><i class="fa-solid fa-xmark"></i></button>
                    
                    <div class="w-14 h-14 rounded-full bg-blue-500/20 flex items-center justify-center mx-auto mb-2 border border-blue-500/30 shadow-lg">
                        <i class="fa-solid fa-users text-2xl text-blue-300 drop-shadow-md"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1">Pilih Profil Warga</h3>
                    <p class="text-xs text-white/70 mb-5">Silakan pilih nama Anda untuk masuk</p>
                    
                    <div class="relative mb-4 shrink-0">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-white/50 text-sm"></i>
                        <input type="text" id="search-warga-login" class="glass-input w-full pl-9 pr-3 py-3 rounded-xl text-sm font-medium bg-black/40" placeholder="Ketik nama atau blok..." oninput="filterWargaLoginList(this.value)" autocomplete="off">
                    </div>
                    
                    <div id="warga-login-list" class="space-y-2 overflow-y-auto custom-scrollbar text-left pr-1 flex-1">
                        ${generateWargaLoginHtml()}
                    </div>
                </div>
            `;
            document.body.appendChild(t);
            document.getElementById('btn-close-warga-login').onclick = () => t.remove();
        }

        function generateWargaLoginHtml(query = '') {
            const lowerQuery = query.toLowerCase();
            const filteredWarga = state.wargaList.filter(w => w.nama.toLowerCase().includes(lowerQuery) || w.blok.toLowerCase().includes(lowerQuery));
            
            if (filteredWarga.length === 0) return '<div class="p-4 text-center text-sm text-white/60 border border-white/5 rounded-xl border-dashed">Warga tidak ditemukan</div>';

            return filteredWarga.map(w => `
                <div onclick="selectWargaForLogin(${w.id})" class="p-3 border border-white/5 bg-white/5 hover:bg-white/10 rounded-xl flex items-center gap-3 cursor-pointer transition-colors active:scale-95 group">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center shrink-0 border border-white/20 shadow-lg shadow-indigo-500/40">
                        <i class="fa-solid fa-user text-lg text-white drop-shadow-md"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-bold text-white leading-tight">${w.nama}</p>
                        <p class="text-[10px] text-white/60 font-medium mt-0.5"><i class="fa-solid fa-house"></i> Blok ${w.blok}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-white/40 text-xs group-active:translate-x-1 transition-transform"></i>
                </div>
            `).join('');
        }

        function filterWargaLoginList(query) {
            document.getElementById('warga-login-list').innerHTML = generateWargaLoginHtml(query);
        }

        function selectWargaForLogin(id) {
            document.getElementById('warga-login-modal').remove();
            const warga = state.wargaList.find(w => w.id === id);
            showPinModal('warga', warga);
        }

        function processLogin(roleKey, selectedWarga = null) {
            if (roleKey === 'warga' && selectedWarga) {
                state.currentUser = {
                    role: 'warga',
                    name: selectedWarga.nama,
                    wargaId: selectedWarga.id,
                    icon: 'fa-user'
                };
            } else {
                state.currentUser = state.users[roleKey];
            }

            state.currentView = 'dashboard';

            let roleName, correctPin, iconKey, colorClass;

                    <div class="w-16 h-16 rounded-full ${colorClass} flex items-center justify-center mx-auto mb-4 border shadow-lg shadow-white/5">

                    </div>
                    <h3 class="text-base font-bold text-white mb-1">Masukkan PIN</h3>
                    <p class="text-xs text-white/70 mb-6 line-clamp-1 px-4">${roleName}</p>
                    
                    <div class="relative mb-4">
                        <input type="password" id="input-pin" maxlength="6" inputmode="numeric" class="glass-input w-full p-3 pr-12 rounded-xl text-center text-xl tracking-[0.5em] font-bold bg-black/40 focus:border-blue-400" placeholder="••••••">

                            <i id="eye-icon-login" class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                    
                    <p id="pin-error" class="text-xs text-red-400 font-bold mb-4 hidden animate-pulse">PIN yang Anda masukkan salah!</p>
                    
                    <button id="btn-submit-pin" class="w-full py-3.5 rounded-xl text-sm font-bold bg-blue-500/80 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/30 transition-colors">Masuk</button>
                    
                    <p class="text-[10px] text-white/60 mt-4">Default PIN (Awal): 123456</p>
                </div>
            `;
            document.body.appendChild(t);
            
            const inputPin = document.getElementById('input-pin');
            inputPin.focus();
            
            document.getElementById('btn-close-pin').onclick = () => {
                t.remove();
                if(roleKey === 'warga') showPilihWargaLoginModal();
            };
            
            const checkPin = () => {
                if (inputPin.value === correctPin) {
                    t.remove();
                    processLogin(roleKey, selectedWarga);
                } else {
                    document.getElementById('pin-error').classList.remove('hidden');
                    inputPin.value = '';
                    inputPin.focus();

            document.getElementById('btn-submit-pin').onclick = checkPin;
            inputPin.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') checkPin();
            });
        }

        function generateWargaListHtml(query = '') {
            const lowerQuery = query.toLowerCase();
            const originalMonths = getBulanList();
            const currentMonthIdx = originalMonths.indexOf("2026-08");

            const filteredWarga = state.wargaList.filter(w => w.nama.toLowerCase().includes(lowerQuery) || w.blok.toLowerCase().includes(lowerQuery));

            if (filteredWarga.length === 0) {
                return '<div class="p-4 text-center text-xs text-white/60 border border-white/5 rounded-xl border-dashed">Warga tidak ditemukan</div>';
            }

            return filteredWarga.map(w => {
                let countTunggakan = 0;
                originalMonths.forEach((bulan, idx) => {
                    if (idx <= currentMonthIdx) {
                        const isPaid = state.iuranList.some(i => i.wargaId === w.id && i.bulan === bulan && i.status === 'Lunas');
                        if (!isPaid) countTunggakan++;
                    }
                });
                
                const totalTunggakan = countTunggakan * state.nominalIuran;
                let statusHtml = '';
                if (countTunggakan === 0) {
                    statusHtml = `<span class="text-[10px] font-bold text-green-300 bg-green-500/20 px-2 py-0.5 rounded border border-green-500/30 inline-block mt-1"><i class="fa-solid fa-check-circle mr-1"></i> Lunas Semua</span>`;
                } else {
                    statusHtml = `<span class="text-[10px] font-bold text-red-300 bg-red-500/20 px-2 py-0.5 rounded border border-red-500/30 inline-block mt-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Nunggak ${formatRp(totalTunggakan)}</span>`;
                }

                return `
                <div onclick="selectWargaUntukBayar(${w.id})" class="p-3 border border-white/5 bg-black/20 hover:bg-white/10 rounded-xl flex justify-between items-center cursor-pointer transition-colors group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center shrink-0 border border-white/20 shadow-lg shadow-indigo-500/40">
                            <i class="fa-solid fa-user text-lg text-white drop-shadow-md"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-white leading-tight">${w.nama}</p>
                            <p class="text-[10px] text-white/60 font-medium"><i class="fa-solid fa-house"></i> Blok ${w.blok}</p>
                            ${statusHtml}
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-active:scale-90 transition-transform">
                        <i class="fa-solid fa-chevron-right text-white/50 text-xs"></i>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterWargaList(query) {
            document.getElementById('warga-list-container').innerHTML = generateWargaListHtml(query);
        }

        function batalPilihWarga() {
            document.getElementById('search-warga-input').value = '';
            filterWargaList('');
            document.getElementById('payment-panel').classList.add('hidden');
            document.getElementById('panel-pilih-warga').classList.remove('hidden');
            penagihanSelectedWargaId = null;
            penagihanSelectedMonths = [];
        }

        function selectWargaUntukBayar(wargaId) {
            penagihanSelectedWargaId = wargaId;
            penagihanSelectedMonths = [];
            
            const warga = state.wargaList.find(w => w.id === wargaId);
            
            document.getElementById('panel-pilih-warga').classList.add('hidden');
            document.getElementById('payment-panel').classList.remove('hidden');

            document.getElementById('payment-warga-info').innerHTML = `
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center shrink-0 border border-white/20 shadow-lg shadow-indigo-500/40">
                    <i class="fa-solid fa-user text-lg text-white drop-shadow-md"></i>
                </div>
                <div class="leading-tight flex-1">
                    <h3 class="text-sm font-bold text-white">${warga.nama}</h3>
                    <span class="text-[10px] text-white/70 font-medium"><i class="fa-solid fa-house text-[10px]"></i> Blok ${warga.blok} • <i class="fa-solid fa-phone text-[10px]"></i> ${warga.telp}</span>
                </div>
            `;

            const namaBulanPendek = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            let monthsHtml = '';
            
            namaBulanPendek.forEach((bln, index) => {
                const targetBulan = `2026-${(index + 1).toString().padStart(2, '0')}`;
                const isPaid = state.iuranList.some(i => i.wargaId === wargaId && i.bulan === targetBulan && i.status === 'Lunas');
                
                if (isPaid) {
                    monthsHtml += `
                        <div class="p-2 rounded-lg bg-green-500/10 border border-green-500/20 text-center opacity-60">
                            <span class="text-xs font-bold text-green-300">${bln}</span>
                            <div class="text-[10px] text-green-400 mt-0.5"><i class="fa-solid fa-check"></i> Lunas</div>
                        </div>`;
                } else {
                    monthsHtml += `
                        <div onclick="toggleMonthSelection('${targetBulan}', this)" class="p-2 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 text-center transition-colors cursor-pointer" data-month="${targetBulan}">
                            <span class="text-xs font-bold text-white/80">${bln}</span>
                            <div class="text-[10px] text-white/50 mt-0.5 icon-label">Pilih</div>
                        </div>`;
                }
            });

            document.getElementById('payment-months-grid').innerHTML = monthsHtml;
            updatePaymentTotal();
            document.getElementById('payment-panel').classList.remove('hidden');
        }

        function toggleMonthSelection(bulan, el) {
            const idx = penagihanSelectedMonths.indexOf(bulan);
            const label = el.querySelector('.icon-label');

            if (idx > -1) {
                penagihanSelectedMonths.splice(idx, 1);
                el.className = "p-2 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 text-center transition-colors cursor-pointer";
                label.innerText = "Pilih"; label.className = "text-[10px] text-white/50 mt-0.5 icon-label";
                el.querySelector('span').className = "text-xs font-bold text-white/80";
            } else {
                penagihanSelectedMonths.push(bulan);
                el.className = "p-2 rounded-lg bg-blue-500/30 border border-blue-400 text-center transition-colors cursor-pointer";
                label.innerHTML = "<i class='fa-solid fa-check'></i>"; label.className = "text-[10px] text-blue-200 mt-0.5 icon-label";
                el.querySelector('span').className = "text-xs font-bold text-white";
            }
            updatePaymentTotal();
        }

            const tgl = new Date().toISOString().split('T')[0];
            
            penagihanSelectedMonths.forEach(bln => {
                state.iuranList.push({
                    id: Date.now() + Math.random(), 
                    wargaId: penagihanSelectedWargaId,
                    bulan: bln, jumlah: state.nominalIuran, status: 'Lunas', tanggal: tgl

        async function submitWarga(e) {
            e.preventDefault();

            const wData = {
                id: isEdit ? editWargaId : Date.now(),
                nama: document.getElementById('warga-nama').value,
                blok: document.getElementById('warga-blok').value,
                telp: document.getElementById('warga-telp').value,
                status: 'Aktif',

            };
            
            showCustomToast('<i class="fa-solid fa-circle-check text-lg"></i> Berhasil Disimpan!');

            if (isEdit) {
                const idx = state.wargaList.findIndex(w => w.id === editWargaId);
                state.wargaList[idx] = wData;
                await saveToCloud();
                editWargaId = null;
                setTimeout(() => navigate('data_warga'), 500); 
            } else {
                state.wargaList.push(wData);
                await saveToCloud();
                document.getElementById('warga-nama').value = '';
                document.getElementById('warga-blok').value = '';
                document.getElementById('warga-telp').value = '';
                document.getElementById('warga-nama').focus();
            }

        window.downloadLaporanKasPDF = function() {
            if (!window.jspdf) {
                showCustomToast("⚠️ Memuat library PDF, coba lagi dalam beberapa detik.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4'); 

            doc.setFontSize(16);
            doc.setFont("helvetica", "bold");
            doc.text("LAPORAN KEUANGAN KAS RT", 105, 20, { align: "center" });
            
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text("Sistem Informasi Smart RT", 105, 26, { align: "center" });
            
            doc.setLineWidth(0.5);
            doc.line(14, 30, 196, 30);
            
            const totalMasuk = state.iuranList.filter(i => i.status === 'Lunas').reduce((sum, i) => sum + i.jumlah, 0);
            const totalKeluar = state.pengeluaranList.reduce((sum, p) => sum + p.nominal, 0);
            const sisaKas = totalMasuk - totalKeluar;

            doc.setFontSize(10);
            doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}`, 14, 40);
            doc.text(`Total Pemasukan: Rp ${totalMasuk.toLocaleString('id-ID')}`, 14, 46);
            doc.text(`Total Pengeluaran: Rp ${totalKeluar.toLocaleString('id-ID')}`, 14, 52);
            
            doc.setFont("helvetica", "bold");
            doc.text(`Saldo Akhir Kas: Rp ${sisaKas.toLocaleString('id-ID')}`, 14, 58);

            let tableData = [];

            state.iuranList.filter(i => i.status === 'Lunas').forEach(item => {
                const w = state.wargaList.find(w => w.id === item.wargaId);
                const nama = w ? w.nama : 'Warga';
                tableData.push([
                    item.tanggal, 
                    `Iuran Bulanan (${item.bulan}) - ${nama}`, 
                    item.jumlah, 
                    0
                ]);
            });

            state.pengeluaranList.forEach(item => {
                tableData.push([
                    item.tanggal, 
                    item.judul, 
                    0, 
                    item.nominal
                ]);
            });

            tableData.sort((a, b) => new Date(a[0]) - new Date(b[0]));

            const finalBody = tableData.map((row, index) => [
                index + 1,
                row[0], 
                row[1], 
                row[2] > 0 ? `Rp ${row[2].toLocaleString('id-ID')}` : '-', 
                row[3] > 0 ? `Rp ${row[3].toLocaleString('id-ID')}` : '-'  
            ]);

            doc.autoTable({
                startY: 65,
                head: [['No', 'Tanggal', 'Uraian / Keterangan', 'Masuk', 'Keluar']],
                body: finalBody,
                theme: 'grid',
                headStyles: { fillColor: [30, 27, 75], textColor: [255, 255, 255] },
                styles: { fontSize: 9, cellPadding: 3 },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 10 },
                    3: { halign: 'right', cellWidth: 35 },
                    4: { halign: 'right', cellWidth: 35 }
                }
            });

            const fileName = `Laporan_Kas_RT_${new Date().toISOString().split('T')[0]}.pdf`;
            doc.save(fileName);
            showCustomToast('<i class="fa-solid fa-download"></i> PDF Berhasil Diunduh');
        }

        async function submitPengeluaran(e) {
            e.preventDefault();
            const isEdit = editId !== null;
            const pData = {
                id: isEdit ? editId : Date.now(),
                judul: document.getElementById('pengeluaran-judul').value,
                nominal: parseInt(document.getElementById('pengeluaran-nominal').value),
                deskripsi: document.getElementById('pengeluaran-deskripsi').value,
                bukti: document.getElementById('pengeluaran-bukti').value,
                tanggal: isEdit ? state.pengeluaranList.find(p=>p.id===editId).tanggal : new Date().toISOString().split('T')[0]
            };
            
            if (isEdit) {
                const idx = state.pengeluaranList.findIndex(p => p.id === editId);
                state.pengeluaranList[idx] = pData;
            } else {
                state.pengeluaranList.push(pData);
            }
            
            await saveToCloud();
            editId = null;
            navigate('kas_rt');
            showCustomToast(isEdit ? '✅ Pengeluaran diperbarui' : '✅ Pengeluaran dicatat');
        }

            const pinConfirm = document.getElementById('pin-baru-konfirmasi').value;

            state.wargaList[wargaIdx].pin = pinBaru;
            await saveToCloud();
            
            showCustomToast('✅ PIN Keamanan berhasil diperbarui');

                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <div>
                            <label class="block text-[10px] font-bold text-white/70 uppercase tracking-widest mb-1.5 ml-1">Tanggal</label>
                            <input type="date" id="pengumuman-date" value="${dInput}" required class="glass-input w-full p-3 rounded-xl text-sm font-medium bg-black/40 focus:border-emerald-400 [color-scheme:dark]">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-white/70 uppercase tracking-widest mb-1.5 ml-1">Waktu</label>
                            <input type="time" id="pengumuman-time" value="${tInput}" required class="glass-input w-full p-3 rounded-xl text-sm font-medium bg-black/40 focus:border-emerald-400 [color-scheme:dark]">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3.5 rounded-xl font-bold bg-emerald-500/80 hover:bg-emerald-500 text-white border border-emerald-400 active:scale-95 transition-transform text-sm shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-save"></i> Simpan Pengumuman
                    </button>
                </form>
                
                <button onclick="navigate('menu_lainnya')" class="w-full py-3.5 rounded-xl font-bold bg-white/10 hover:bg-white/20 text-white border border-white/20 text-sm flex items-center justify-center gap-2 transition-colors active:scale-95">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Menu
                </button>
            `;
            return html;
        };

        window.submitPengumuman = async function(e) {
            e.preventDefault();
            
            const dateVal = document.getElementById('pengumuman-date').value;
            const timeVal = document.getElementById('pengumuman-time').value;
            
            // Format Tanggal Otomatis (Cth: "Minggu, 11 Okt 2026, 07:00 WIB")
            const dateObj = new Date(`${dateVal}T${timeVal}`);
            const hariList = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const bulanList = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            
            const hari = hariList[dateObj.getDay()];
            const tanggal = dateObj.getDate();
            const bulan = bulanList[dateObj.getMonth()];
            const tahun = dateObj.getFullYear();
            
            const formattedDisplay = `${hari}, ${tanggal} ${bulan} ${tahun}, ${timeVal} WIB`;

            state.pengumuman = {
                judul: document.getElementById('pengumuman-judul').value,
                deskripsi: document.getElementById('pengumuman-deskripsi').value,
                tanggal: formattedDisplay,
                dateInput: dateVal,
                timeInput: timeVal
            };
            await saveToCloud();
            showCustomToast('✅ Pengumuman berhasil diperbarui');
            navigate('dashboard');
        };

        // --- SISTEM PWA & NATIVE PUSH NOTIFICATION ---
        window.swRegistration = null;

        window.initPWA = function() {
            // 1. Buat PWA Manifest secara dinamis
            const manifest = {
                "name": "Smart RT Mobile",
                "short_name": "Smart RT",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#1e1b4b",
                "theme_color": "#1e1b4b",
                "icons": [{
                    "src": "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Building/3D/building_3d.png",
                    "sizes": "192x192",
                    "type": "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(manifestBlob);
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestUrl}">`);

            // 2. Buat Service Worker dinamis untuk menangani Push & Notifikasi background
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', (e) => { }); // Bypass fetch agar lolos syarat PWA
                    self.addEventListener('push', (e) => {
                        const data = e.data ? e.data.json() : {title: 'Info Smart RT', body: 'Cek aplikasi.'};
                        e.waitUntil(self.registration.showNotification(data.title, { 
                            body: data.body, 
                            icon: 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Building/3D/building_3d.png', 
                            vibrate: [200, 100, 200] 
                        }));
                    });
                    self.addEventListener('notificationclick', (e) => {
                        e.notification.close();
                        e.waitUntil(clients.matchAll({type: 'window'}).then(clientsArr => {
                            if (clientsArr.length) return clientsArr[0].focus();
                            return clients.openWindow('/');
                        }));
                    });
                `;
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).then(reg => {
                    window.swRegistration = reg;
                }).catch(err => console.log('Service Worker tidak aktif karena pembatasan Iframe:', err));
            }
            
            checkNotificationStatus();
        }

        function checkNotificationStatus() {
            if (!('Notification' in window)) return;
            const bellBadge = document.getElementById('bell-badge');
            const bellIcon = document.getElementById('bell-icon');
            
            if (Notification.permission === 'granted') {
                if(bellBadge) bellBadge.classList.remove('hidden');
                if(bellIcon) {
                    bellIcon.classList.remove('fa-regular', 'text-white/80');
                    bellIcon.classList.add('fa-solid', 'text-yellow-400');
                }
            }
        }

        window.requestNotificationPermissionUI = async function() {
            if (!('Notification' in window)) {
                showCustomToast('❌ Browser Anda tidak mendukung Notifikasi Sistem.');
                return;
            }
            if (Notification.permission === 'granted') {
                showCustomToast('✅ Notifikasi PWA sudah aktif!');
                triggerNativeNotification('Notifikasi Aktif', 'Aplikasi Smart RT siap menerima pemberitahuan latar belakang.');
                return;
            }
            
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                checkNotificationStatus();
                showCustomToast('✅ Izin Notifikasi Sistem OS Diberikan!');
                triggerNativeNotification('Selamat Datang', 'Pemberitahuan resmi Smart RT berhasil diaktifkan.');
            } else {
                showCustomToast('⚠️ Izin Notifikasi ditolak oleh Anda.');
            }
        };

        window.triggerNativeNotification = function(title, body) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;

            const iconUrl = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Building/3D/building_3d.png';

            // Kirim notifikasi melalui ServiceWorker (Lebih bagus, muncul di control center)
            if (window.swRegistration && window.swRegistration.showNotification) {
                window.swRegistration.showNotification(title, { body: body, icon: iconUrl, vibrate: [200, 100, 200] })
                .catch(() => new Notification(title, { body: body, icon: iconUrl }));
            } else {
                // Fallback biasa (Desktop Notification API)
                new Notification(title, { body: body, icon: iconUrl });
            }
        };
    </script>
</body>
</html>
